<div class="conf-grid">
    @for (conf of conferences; track conf.id) {
    <article class="conf-card" (click)="toggleDetails(conf)">
        <h3>{{ conf.title | uppercase }}</h3>

        <p><strong>Date :</strong> {{ conf.date | date: 'dd/MM/yyyy' }}</p>
        <p><strong>Lieu :</strong> {{ conf.address }}</p>
        <p><strong>Places restantes :</strong> {{ conf.availablePlaces }}</p>

        @if (selectedId === conf.id) {
        <p class="details">{{ conf.description }}</p>
        }

        <button class="btn-conf" [ngClass]="btnClass(conf)" [disabled]="conf.availablePlaces === 0"
            (click)="onBook($event, conf)">
            S'inscrire
        </button>
    </article>
    } @empty {
    <p class="empty">Aucune conférence à venir.</p>
    }
</div>
