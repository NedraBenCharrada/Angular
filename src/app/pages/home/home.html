<div class="page">
    <app-user-profile />
    <app-friends-list />
    <app-notifications />

    <section class="section-card green" id="conferences">
        <div class="section-head">
            <div class="icon-circle"><i class="bi bi-calendar3"></i></div>
            <div>
                <h2>Liste des conférences à venir</h2>
                <p class="subtitle">Cliquez sur une conférence pour afficher ses détails.</p>
            </div>
        </div>

        <input type="text" name="search" class="search-input" placeholder="Taper le titre de la conférence"
            [(ngModel)]="searchTitle" />

        <app-list-conf [conferences]="filteredList" (book)="participate($event)" />
    </section>
</div>
