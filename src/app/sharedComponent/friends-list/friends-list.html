<section class="section-card green" id="amis">
    <div class="section-head">
        <div class="icon-circle"><i class="bi bi-people-fill"></i></div>
        <h2>Liste des amis</h2>
    </div>

    <div class="inputs">
        <input type="text" name="name1" [(ngModel)]="userName" />
        <input type="text" name="name2" [(ngModel)]="userName" />
        <input type="text" name="name3" [(ngModel)]="userName" />
    </div>

    <ul>
        @for (friend of friends; track friend) {
        <li>{{ friend }}</li>
        } @empty {
        <li>Aucun ami.</li>
        }
    </ul>
</section>
